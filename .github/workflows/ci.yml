name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the GitHub token in the repo's git config for later steps.
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: 'pnpm install --frozen-lockfile'

      - name: Run lint
        run: 'pnpm lint'

      - name: Run build
        run: 'pnpm build'

      - name: Run tests
        run: 'pnpm test'

      # The lint rules n8n's community package scan applies, on the source and the
      # packed tarball. Provenance is only checked once a version is on npm.
      - name: Run n8n community package scan
        run: 'node scripts/scan-local.mjs'
